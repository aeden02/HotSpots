services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # backend: add once Christian pushes backend code
  # backend:
  #   build: ./backend
  #   env_file: .env
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     mongo:
  #       condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://backend:4000
    ports:
      - "5173:5173"

volumes:
  mongo-data:
  ollama-data: