services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ai:
    build: ./ai
    ports: 
      - "8000:8000"
    volumes:
      #Word2Vec model (~1.7GB) downloaded on first step and kept here. 
      - ai-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c","import socket; socket.create_connection(('localhost', 8000))"]
      interval: 10s
      retries: 10
      start_period: 20m


  backend:
    build: ./backend
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - AI_URL=http://ai:8000
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://backend:4000
    ports:
      - "5173:5173"

volumes:
  mongo-data:
  ollama-data:
  ai-models: